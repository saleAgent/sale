<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesAgent — User Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--surface:#fff;--surface2:#f8faff;--line:#e4e9f2;--text:#172033;--muted:#6b768b;--accent:#4568e8;--teal:#13a58b;--danger:#d94b62;--shadow:0 8px 28px rgba(22,38,72,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.wrap{max-width:1160px;margin:auto;padding:20px clamp(12px,2.4vw,28px) 36px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.brand{display:flex;align-items:center;gap:9px}.brandmark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4568e8,#8294f3);font-size:16px;color:white}.brand h1{font-size:16px;margin:0;letter-spacing:-.4px}.brand p{font-size:10px;color:var(--muted);margin:2px 0 0}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:#4259bb;text-decoration:none;border:1px solid #dce3f3;border-radius:8px;padding:8px 10px;background:#fff;font-size:11px;font-weight:650}.links a:hover{border-color:#9eaff1;background:#f8f9ff}.eyebrow{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:#168d7b;font-weight:800;margin-bottom:6px}.page-title{font-size:clamp(22px,2.5vw,29px);letter-spacing:-.8px;margin:0}.sub{color:var(--muted);font-size:11px;line-height:1.55;margin:6px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}.login{max-width:410px;margin:35px auto}.login h2{font-size:17px;margin:0 0 6px}.field{margin:11px 0}.field label{display:block;font-weight:750;color:#536078;font-size:10px;margin-bottom:5px}.field input{width:100%;padding:9px 10px;border:1px solid #dce3ed;border-radius:8px;background:#fbfcfe;color:var(--text);outline:none;font-size:12px}.field input:focus,.toolbar input:focus,.toolbar select:focus{border-color:#8095ef;box-shadow:0 0 0 3px #4568e814;background:#fff}.btn{padding:9px 13px;background:linear-gradient(110deg,#4568e8,#6682f1);color:#fff;border:0;border-radius:8px;font-size:11px;font-weight:750}.btn:hover{filter:brightness(1.04)}.btn:disabled{opacity:.55;cursor:wait}.btn.alt{background:#fff;color:#526078;border:1px solid #dce3ed}.btn.danger{background:#fff1f3;color:#bf4056;border:1px solid #f1cbd2}.muted{color:var(--muted);font-size:11px;line-height:1.5}.status{min-height:17px;font-size:11px;margin:9px 0 0}.error,.err{color:var(--danger)}.ok{color:#12836f}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;margin-top:14px}.product{border:1px solid #e3e8f1;border-radius:10px;padding:10px;background:#fff;min-width:0;box-shadow:0 3px 12px rgba(22,38,72,.035)}.product img{width:100%;height:135px;object-fit:cover;background:#f0f3f8;border-radius:7px}.product h3{margin:9px 0 4px;font-size:14px}.product p{color:#69758a;line-height:1.45;font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;color:#435bb8;font-size:10px;margin:2px 3px 2px 0}.hidden{display:none!important}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.toolbar input,.toolbar select{padding:8px 10px;border:1px solid #dce3ed;border-radius:8px;background:#fbfcfe;color:var(--text);outline:none;font-size:11px}.toolbar input{flex:1;min-width:200px}.tablewrap{overflow:auto;border:1px solid #e3e8f1;border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px 10px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:middle}th{background:#f7f8fc;color:#68758c;font-size:9px;text-transform:uppercase;letter-spacing:.7px}td{font-size:11px;color:#354159}tbody tr:hover{background:#fafbff}td img{width:48px;height:42px;object-fit:cover;border-radius:6px}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions .btn{font-size:10px;padding:6px 8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}.stat{padding:12px;border:1px solid #e3e8f1;border-radius:10px;background:#fff}.stat span{font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:4px;color:#263653}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.section-head h2{font-size:15px;margin:0}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:650px){.wrap{padding-top:14px}.head{align-items:flex-start}.links{width:100%}.links a{flex:1;text-align:center}.card{padding:13px}.stats{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr}.toolbar input{min-width:100%}}
</style></head><body><main class="wrap"><header class="head"><nav class="links"><a href="./index.html">＋ New promotion</a></nav></header>

<section class="card login" id="loginBox"><h2>Access your workspace</h2><p class="muted">Sign in with the mobile number and Browser ID used when you submitted your product. Use the same browser profile.</p>
<div class="field"><label for="mobile">Registered mobile number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit mobile"></div>
<div class="field"><label for="browserId">Your Browser ID</label><input id="browserId" placeholder="Loading browser ID"></div>
<button class="btn" id="loginBtn">Load my promotions →</button><p id="loginStatus" class="status"></p></section>
<section class="card hidden" id="results"><div class="section-head"><div><h2>Your products</h2><p class="muted" id="resultInfo"></p></div><div class="links"><a href="./index.html">＋ Create another</a><button class="btn alt" id="logoutBtn" type="button">Change account</button></div></div><div class="products" id="productList"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,getDocs,query,where,doc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInAnonymously,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const cfg={ apiKey: "AIzaSyAzJoZn0twxiIvLTd1yWgo0k0PepV4WoUA",authDomain:"salesagent-2c22f.firebaseapp.com",projectId:"salesagent-2c22f",storageBucket:"salesagent-2c22f.firebasestorage.app",messagingSenderId:"614955740633",appId:"1:614955740633:web:8478a4a242984d79adfdc8",measurementId:"G-3VE4DV0KG0"};
const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);
function getBrowserId(){let id=localStorage.getItem("salesagent_browser_id");if(!id){id=crypto.randomUUID();localStorage.setItem("salesagent_browser_id",id)}return id}
const currentBrowserId=getBrowserId();$("browserId").value=currentBrowserId;let user=null;
function setStatus(s,err=false){$("loginStatus").textContent=s;$("loginStatus").className="status "+(err?"error":"ok")}
async function init(){await setPersistence(auth,browserLocalPersistence);user=await new Promise(resolve=>{const unsub=onAuthStateChanged(auth,u=>{unsub();resolve(u)})});if(!user)user=(await signInAnonymously(auth)).user}
function safeText(value){return String(value??"")}
let loadedProducts=[];
function render(items){loadedProducts=items;const list=$("productList");list.innerHTML="";if(!items.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="No products found for this mobile number and Browser ID.";list.append(empty);return}items.forEach(p=>{const card=document.createElement("article");card.className="product";const img=document.createElement("img");img.src=p.productPhoto||"";img.alt=p.productName||"Product";if(!p.productPhoto)img.classList.add("hidden");card.append(img);const h=document.createElement("h3");h.textContent=p.productName||"Untitled product";card.append(h);const desc=document.createElement("p");desc.textContent=p.description||"";card.append(desc);const meta=document.createElement("p");for(const label of [`Plan ₹${Number(p.plan||0)}`,`Payment: ${p.paymentStatus||"Pending"}`,`Promotion: ${p.approvalStatus||"Pending"}`]){const pill=document.createElement("span");pill.className="pill";pill.textContent=label;meta.append(pill)}card.append(meta);const loc=document.createElement("p");loc.className="muted";loc.textContent=(p.location||"")+(p.radius?` · ${p.radius} km radius`:"");card.append(loc);const actions=document.createElement("div");actions.className="actions";const del=document.createElement("button");del.type="button";del.className="btn danger";del.textContent="Delete product";del.addEventListener("click",async()=>{if(!confirm(`Delete “${p.productName||"this product"}” permanently? This cannot be undone.`))return;del.disabled=true;del.textContent="Deleting…";try{await deleteDoc(doc(db,"products",p.id));const next=loadedProducts.filter(x=>x.id!==p.id);render(next);$("resultInfo").textContent=`${next.length} product(s) found.`;setStatus("Product deleted successfully.");}catch(e){console.error(e);setStatus("Delete failed: "+e.message,true);del.disabled=false;del.textContent="Delete product"}});actions.append(del);card.append(actions);list.append(card)})}
$("loginBtn").addEventListener("click",async()=>{const mobile=$("mobile").value.trim(),browserId=$("browserId").value.trim();if(!/^[0-9]{10}$/.test(mobile)){setStatus("Enter a valid 10-digit mobile number.",true);return}if(browserId!==currentBrowserId){setStatus("This Browser ID does not match this browser. Use the original browser identity.",true);return}$("loginBtn").disabled=true;setStatus("Checking your products…");try{if(!user)await init();const q=query(collection(db,"products"),where("ownerUid","==",user.uid),where("browserId","==",browserId));const snap=await getDocs(q);const items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.mobile===mobile).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("results").classList.remove("hidden");$("resultInfo").textContent=`Found ${items.length} product(s).`;render(items);if(items.length){$("loginBox").classList.add("hidden");$("results").classList.remove("hidden");setStatus("Products loaded.")}else{setStatus("No matching products found. Check your mobile number and try again.",true)}}catch(e){console.error(e);setStatus("Could not load products: "+e.message,true)}finally{$("loginBtn").disabled=false}});
$("logoutBtn").addEventListener("click",()=>{$("results").classList.add("hidden");$("loginBox").classList.remove("hidden");$("mobile").value="";setStatus("Enter your registered mobile number to load your products.")});
init().catch(e=>setStatus("Firebase authentication failed: "+e.message,true));
</script></body></html>
